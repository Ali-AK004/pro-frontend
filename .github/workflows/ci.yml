name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Known vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://academitna.online/api
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: academitna-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
